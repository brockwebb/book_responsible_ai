# Only `book` is read by Seldon code: config.get_content_dir() resolves
# paths.sections -> paths.book -> paper/sections, and verify/glossary and the
# MCP server look up paths.paper|book. Pointing `book` at book/ makes the MyST
# project the content root. The remaining keys are documentation-only — no code
# reads them — kept to mirror the sibling ai-workflow-design layout.
paths:
  book: book/
  manuscript: manuscript/   # documentation-only
  assets: assets/           # documentation-only
  cc_tasks: cc_tasks/       # documentation-only
  handoffs: handoffs/       # documentation-only
