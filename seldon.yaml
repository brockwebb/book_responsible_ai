  name: book_responsible_ai
  slug: book-responsible-ai
  template: blank
  description: >-
    The Overresponsible AI Handbook: An Alphabetical Guide to Doing Nothing,
    Responsibly — a satirical A-Z alphabet book on AI governance theater.

# Only `book` is read by Seldon code: config.get_content_dir() resolves
# paths.sections -> paths.book -> paper/sections, and verify/glossary and the
# MCP server look up paths.paper|book. Pointing `book` at book/ makes the MyST
# project the content root. The remaining keys are documentation-only — no code
# reads them — kept to mirror the sibling ai-workflow-design layout.
paths:
  book: book/
  manuscript: manuscript/   # documentation-only
  assets: assets/           # documentation-only
  cc_tasks: cc_tasks/       # documentation-only
  handoffs: handoffs/       # documentation-only
shared_ontology:
  inheritance: read-only
  source: /Users/brock/Documents/GitHub/seldon/ontology
  vocabularies:
  - validity/VALIDITY_VOCABULARY.md

prior_art:
  # AD-036 (seldon): the prior-art receipts gate, by REFERENCE to seldon's one definition, never a copy (SQ-010
  # Part 0; seldon docs/design/AD-036_ADDENDUM_03_prior_art_by_reference.md). The corpus paths resolve from seldon's
  # file; the log, the design directory, the baseline and the verdict ledger resolve from this repository. Only the
  # baseline is this repository's own: the notes on main when the gate reached it, grandfathered.
  ref: ../seldon/seldon.yaml#prior_art
  gate:
    baseline: docs/design/AD-036_baseline.txt
