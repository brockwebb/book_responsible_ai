version: 1
project:
  title: 'The Overresponsible AI Handbook'
  subtitle: 'An Alphabetical Guide to Doing Nothing, Responsibly'
  authors:
    - name: Brock Webb
  license: CC-BY-4.0
  copyright: '2026 Brock Webb'
  github: brockwebb/book_responsible_ai
  jupyter: false
  # No exports block, deliberately. The PDF has exactly one build path:
  # scripts/build_pdf.sh (standalone Typst via book/pdf/main.typ + book_map.yaml).
  # The MyST typst export was removed because it flattened the book into a
  # numbered-article template and could not express the real layout — mixed
  # portrait/landscape, full-bleed posters, letter-grid navigation. Two PDF
  # paths would mean two divergent books.
  toc:
    - file: cover.md
    - file: front-matter.md
    - file: alphabet.md
    - file: back-matter.md
    - file: coloring-pages.md
site:
  options:
    folders: true
  template: book-theme
